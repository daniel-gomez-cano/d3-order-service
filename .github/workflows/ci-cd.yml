# ============================================================
#  CI/CD — d3-order-service
#
#  Qué hace este pipeline:
#    1. En todo push/PR a main: compila el código y corre los tests.
#       Los resultados de tests se muestran en la pestaña "Checks"
#       de GitHub con una tabla de tests pasados/fallidos.
#    2. Solo cuando hay merge a main: construye el JAR, luego la
#       imagen Docker, y la publica en Docker Hub con dos tags:
#         • latest
#         • sha-<primeros 7 caracteres del commit>
#
#  Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#    DOCKERHUB_USERNAME  →  tu usuario de Docker Hub
#    DOCKERHUB_TOKEN     →  un Access Token de Docker Hub
#                           (Hub → Account Settings → Security → New Access Token)
# ============================================================

name: CI/CD — d3-order-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Permisos necesarios para que dorny/test-reporter pueda escribir
# los resultados de tests como un "Check" visible en GitHub
permissions:
  contents: read
  checks: write
  pull-requests: write

jobs:

  # ──────────────────────────────────────────────────────────
  #  JOB 1: Compilar y ejecutar pruebas
  #  Corre tanto en PRs como en merges a main
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Compilar y testear
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # cachea ~/.m2 entre ejecuciones → más rápido

      - name: Compilar proyecto
        run: mvn -B --no-transfer-progress compile -q

      # Los tests usan H2 en memoria y Mockito puro, no necesitan
      # Keycloak ni PostgreSQL corriendo
      - name: Correr tests
        run: mvn -B --no-transfer-progress test

      # dorny/test-reporter lee los XML de Surefire y los convierte
      # en una tabla de resultados visible en la pestaña "Checks" de GitHub.
      # if: always() garantiza que corre incluso si los tests fallaron,
      # para que puedas ver QUÉ test falló, no solo "el job falló".
      - name: Publicar resultados de tests en GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados de tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # ──────────────────────────────────────────────────────────
  #  JOB 2: Empaquetar JAR y publicar imagen en Docker Hub
  #  Solo corre cuando hay un push (merge) a main
  # ──────────────────────────────────────────────────────────
  docker-publish:
    name: 🐳 Publicar imagen Docker
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      # Se construye el JAR aquí (sin tests, ya corrieron en el job anterior).
      # El Dockerfile luego solo copia el JAR — sin descargar Maven dentro de Docker.
      - name: Empaquetar JAR (sin tests)
        run: mvn -B --no-transfer-progress package -DskipTests -q

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Genera los tags automáticamente:
      #   • <usuario>/d3-order-service:latest
      #   • <usuario>/d3-order-service:sha-a1b2c3d
      - name: Extraer metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/d3-order-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
