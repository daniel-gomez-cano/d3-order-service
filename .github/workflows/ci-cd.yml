# ============================================================
#  CI/CD — d3-order-service
#
#  Qué hace este pipeline:
#    1. En todo push/PR a main: compila el código y corre los tests.
#    2. Solo cuando hay merge a main: construye la imagen Docker
#       y la publica en Docker Hub con dos tags:
#         • latest
#         • sha-<primeros 7 caracteres del commit>
#
#  Secrets necesarios en GitHub → Settings → Secrets and variables → Actions:
#    DOCKERHUB_USERNAME  →  tu usuario de Docker Hub
#    DOCKERHUB_TOKEN     →  un Access Token de Docker Hub
#                           (Hub → Account Settings → Security → New Access Token)
# ============================================================

name: CI/CD — d3-order-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

  # ──────────────────────────────────────────────────────────
  #  JOB 1: Compilar y ejecutar pruebas
  #  Corre tanto en PRs como en merges a main
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: 🔨 Compilar y probar
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # cachea ~/.m2 entre ejecuciones

      - name: Compilar y ejecutar pruebas
        run: mvn -B --no-transfer-progress verify

      # Guarda el reporte de Surefire para revisarlo si algo falla
      - name: Archivar reporte de pruebas
        if: always()            # corre aunque los tests fallen
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  # ──────────────────────────────────────────────────────────
  #  JOB 2: Construir imagen y publicar en Docker Hub
  #  Solo corre cuando hay un push (merge) a main
  # ──────────────────────────────────────────────────────────
  docker-publish:
    name: 🐳 Publicar imagen Docker
    needs: build-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Genera los tags automáticamente:
      #   • <usuario>/d3-order-service:latest
      #   • <usuario>/d3-order-service:sha-a1b2c3d
      - name: Extraer metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME }}/d3-order-service
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # Cachea capas de Docker en GitHub Actions → builds más rápidos
          cache-from: type=gha
          cache-to: type=gha,mode=max
