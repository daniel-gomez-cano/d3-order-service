name: CI/CD — d3-order-service

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# Antes habian permisos globalos, los borre para evitar problemas con el Sonar

jobs:

  # ──────────────────────────────────────────────────────────
  #  JOB 1: Compilar y ejecutar pruebas
  #  Corre tanto en PRs como en merges a main
  # ──────────────────────────────────────────────────────────
  build-and-test:
    name: Compilar y testear
    runs-on: ubuntu-latest
    # Movimos los permisos requeridos por dorny/test-reporter a nivel de JOB
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven          # cachea ~/.m2 entre ejecuciones → más rápido

      - name: Compilar proyecto
        run: mvn -B --no-transfer-progress compile -q

      # Los tests usan H2 en memoria y Mockito puro, no necesitan
      # Keycloak ni PostgreSQL corriendo
      - name: Correr tests
        run: mvn -B --no-transfer-progress test

      # dorny/test-reporter lee los XML de Surefire y los convierte
      # en una tabla de resultados visible en la pestaña "Checks" de GitHub.
      - name: Publicar resultados de tests en GitHub
        uses: dorny/test-reporter@v1
        if: always()
        with:
          name: Resultados de tests
          path: target/surefire-reports/*.xml
          reporter: java-junit

  # ──────────────────────────────────────────────────────────
  #  JOB 2: Análisis SonarCloud
  # ──────────────────────────────────────────────────────────
  sonarcloud:
    name: Análisis SonarCloud
    runs-on: ubuntu-latest
    needs: build-and-test
    # Permisos a nivel de JOB para que SonarCloud no arroje error
    permissions:
      contents: read
      checks: write
      pull-requests: write

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Importante para que Sonar analice todo el historial

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Ejecutar análisis SonarCloud
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Usamos mvn compile antes de sonar:sonar para que encuentre los binarios
        run: mvn -B --no-transfer-progress compile sonar:sonar -Dsonar.projectKey=daniel-gomez-cano_d3-order-service -Dsonar.organization=daniel-gomez-cano

  # ──────────────────────────────────────────────────────────
  #  JOB 3: Empaquetar JAR y publicar imagen en Docker Hub
  #  Solo corre cuando hay un push (merge) a main
  # ──────────────────────────────────────────────────────────
  docker-publish:
    name: Publicar imagen Docker
    needs: sonarcloud
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Empaquetar JAR (sin tests)
        run: mvn -B --no-transfer-progress package -DskipTests -q

      - name: Iniciar sesión en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Configurar Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Construir y publicar imagen
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ secrets.DOCKERHUB_USERNAME }}/d3-order-service:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max